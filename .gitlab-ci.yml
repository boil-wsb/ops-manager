stages:
  - setup
  - lint
  - test
  - build
  - deploy

default:
  interruptible: true
  tags:
    - runner-192.168.23.36

variables:
  PYTHON_IMAGE: 192.168.100.213:8083/devops/python:3.12-slim
  NODE_IMAGE: 192.168.100.213:8083/devops/node:24-alpine
  DOCKER_IMAGE_BACKEND: opsmanager/backend:v1.0.$CI_PIPELINE_IID
  DOCKER_IMAGE_FRONTEND: opsmanager/frontend:v1.0.$CI_PIPELINE_IID
  REMOTE_USER: root
  REMOTE_HOST: "192.168.23.36"
  REMOTE_DIR: "/opt/ops-manager"
  COVERAGE_MIN: "40"

### RULES REUSED VIA YAML ANCHORS:
.if-release-branch: &if-release-branch
  if: '($CI_COMMIT_REF_NAME =~ /release/) && $CI_PIPELINE_SOURCE != "merge_request_event"'

.if-release-branch-merge: &if-release-branch-merge
  if: '($CI_COMMIT_REF_NAME =~ /release/) && $CI_PIPELINE_SOURCE == "merge_request_event"'

.if-dev-int-branch: &if-dev-int-branch
  if: '($CI_COMMIT_REF_NAME =~ /develop/) && $CI_PIPELINE_SOURCE != "merge_request_event"'

.if-test-int-branch: &if-test-int-branch
  if: '$CI_PIPELINE_SOURCE != "merge_request_event" && $CI_PIPELINE_SOURCE == "web" && $DEPLOYER == "test"'

.if-other-branch: &if-other-branch
  if: '($CI_COMMIT_REF_NAME =~ /feature/ || $CI_COMMIT_REF_NAME =~ /hotfix/) && $CI_PIPELINE_SOURCE == "merge_request_event"'

.if-master-branch: &if-master-branch
  if: '($CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH) && $CI_PIPELINE_SOURCE != "merge_request_event"'

.if-merge-request: &if-merge-request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

workflow:
  rules:
    - <<: *if-other-branch
      when: never
    - if: $CI_MERGE_REQUEST_IID
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"
    - <<: *if-dev-int-branch
    - <<: *if-test-int-branch
    - <<: *if-release-branch
    - <<: *if-release-branch-merge
    - <<: *if-master-branch
    - <<: *if-merge-request

# Setup Stage
setup-env:
  stage: setup
  script:
    - echo "VERSION=${VERSION}"
    - echo "DOCKER_IMAGE_BACKEND=${DOCKER_IMAGE_BACKEND}"
    - echo "DOCKER_IMAGE_FRONTEND=${DOCKER_IMAGE_FRONTEND}"
  artifacts:
    reports:
      dotenv:
        - build.env

# Lint Stage - Backend
backend-lint:
  stage: lint
  image: $PYTHON_IMAGE
  tags:
    - ops-docker
  cache:
    key: "pip-backend-$CI_COMMIT_REF_SLUG"
    paths:
      - /root/.cache/pip
      - backend/.venv
    policy: pull-push
  before_script:
    - pip config set global.index-url https://mirrors.aliyun.com/pypi/simple
    - pip config set global.trusted-host mirrors.aliyun.com
    - cd backend
    - export PYTHONPATH=$PWD:$PYTHONPATH
    - python -m venv .venv && source .venv/bin/activate
    - pip install -r requirements/dev.txt -q
  script:
    - source .venv/bin/activate
    - ruff check app/
    - ruff format --check app/
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: true

# Lint Stage - Frontend
frontend-lint:
  stage: lint
  image: $NODE_IMAGE
  tags:
    - ops-docker
  before_script:
    - cd frontend
    - npm install --registry=https://registry.npmmirror.com 
  script:
    - npm run lint
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: true

# Type Check - Frontend
frontend-typecheck:
  stage: lint
  image: $NODE_IMAGE
  tags:
    - ops-docker
  before_script:
    - cd frontend
    - npm install --registry=https://registry.npmmirror.com 
  script:
    - npx tsc --noEmit
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: true

# Test Stage - Backend
backend-test:
  stage: test
  image: $PYTHON_IMAGE
  tags:
    - ops-docker
  cache:
    key: "pip-backend-$CI_COMMIT_REF_SLUG"
    paths:
      - /root/.cache/pip
      - backend/.venv
    policy: pull-push
  before_script:
    - pip config set global.index-url https://mirrors.aliyun.com/pypi/simple
    - pip config set global.trusted-host mirrors.aliyun.com
    - cd backend
    - export PYTHONPATH=$PWD:$PYTHONPATH
    - export SECRET_KEY=test-secret-key-for-ci-only-min-32-chars
    - export ENVIRONMENT=testing
    - export DATABASE_URL=postgresql+asyncpg://opsmanager:opsmanager@192.168.23.36:15432/opsmanager_test
    - export REDIS_URL=redis://192.168.23.36:16379/0
    - export DISABLE_RATE_LIMIT=true
    - python -m venv .venv && source .venv/bin/activate
    - pip install -r requirements/dev.txt -q
  script:
    - source .venv/bin/activate
    - pytest tests/ -v --cov=app --cov-report=xml --cov-report=html --cov-fail-under=$COVERAGE_MIN
  coverage: '/(?i)TOTAL.*\s+(\d+\.\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: backend/coverage.xml
    paths:
      - backend/coverage/
    expire_in: 1 week
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: false

# Security Scan - Backend
backend-security:
  stage: test
  image: $PYTHON_IMAGE
  tags:
    - ops-docker
  cache:
    key: "pip-backend-$CI_COMMIT_REF_SLUG"
    paths:
      - /root/.cache/pip
      - backend/.venv
    policy: pull-push
  before_script:
    - pip config set global.index-url https://mirrors.aliyun.com/pypi/simple
    - pip config set global.trusted-host mirrors.aliyun.com
    - cd backend
    - python -m venv .venv && source .venv/bin/activate
    - pip install safety bandit -q || true
  script:
    - source .venv/bin/activate
    - safety check --json || true
    - bandit -r app/ -f json -o bandit-report.json || true
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: true

# Build Stage - Backend
docker-build-backend:
  stage: build
  script:
    - echo "Building backend image..."
    - echo "docker build -pull -t $REGISTRY_URL/$DOCKER_IMAGE_BACKEND ./backend"
    - docker build --pull -t $REGISTRY_URL/$DOCKER_IMAGE_BACKEND ./backend
    - docker push $REGISTRY_URL/$DOCKER_IMAGE_BACKEND
  rules:
    - <<: *if-master-branch
      exists:
        - backend/Dockerfile

# Build Stage - Frontend
docker-build-frontend:
  stage: build
  script:
    - echo "Building frontend image..."
    - echo "docker build -pull -t $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND ./frontend"
    - docker build --pull -t $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND ./frontend
    - docker push $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND
  rules:
    - <<: *if-master-branch
      exists:
        - frontend/Dockerfile

# Deploy Stage
deploy-docker:
  stage: deploy
  script:
    - |
      set -e
      echo "=== Deploying OpsManager ==="
      echo "Backend Image: $REGISTRY_URL/$DOCKER_IMAGE_BACKEND"
      echo "Frontend Image: $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND"

      # Export environment variables for docker-compose
      export REGISTRY_URL=$REGISTRY_URL
      export VERSION=v1.0.$CI_PIPELINE_IID

      # Pull latest images
      cd $REMOTE_DIR
      docker-compose pull

      # Restart services with new images
      docker-compose down
      docker-compose up -d

      # Wait for services to be healthy
      echo "Waiting for services to start..."
      sleep 10

      # Check health
      if curl -f http://localhost:8080/health > /dev/null 2>&1; then
        echo "=== Deployment successful ==="
      else
        echo "=== Health check failed ==="
        docker-compose logs --tail=50
        exit 1
      fi
  rules:
    - <<: *if-master-branch
