# Security Scan - Backend
backend-security:
  stage: test
  image: $PYTHON_IMAGE
  tags:
    - ops-docker
  cache:
    key: "pip-security-$CI_COMMIT_REF_SLUG"
    paths:
      - /root/.cache/pip
      - backend/.venv-security
    policy: pull-push
  before_script:
    - pip config set global.index-url https://mirrors.aliyun.com/pypi/simple
    - pip config set global.trusted-host mirrors.aliyun.com
    - cd backend
    - test -d .venv-security || python -m venv .venv-security
    - source .venv-security/bin/activate
    - pip install safety bandit pip-audit -q || true
  script:
    - source .venv-security/bin/activate
    - safety scan --json || true
    - bandit -r app/ -f json -o bandit-report.json || true
    - pip-audit --format=json || true
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: true

# Security Scan - Frontend
frontend-security:
  stage: test
  image: $NODE_IMAGE
  tags:
    - ops-docker
  cache:
    key: "npm-frontend-$CI_COMMIT_REF_SLUG"
    paths:
      - frontend/node_modules
    policy: pull
  before_script:
    - cd frontend
    - npm install --registry=https://registry.npmmirror.com
  script:
    - npx audit --json || true
  rules:
    - <<: *if-merge-request
    - <<: *if-master-branch
    - <<: *if-release-branch
  allow_failure: true

# Build Stage - Backend
docker-build-backend:
  stage: build
  script:
    - echo "Building backend image..."
    - echo "docker build -pull -t $REGISTRY_URL/$DOCKER_IMAGE_BACKEND ./backend"
    - docker build --pull -t $REGISTRY_URL/$DOCKER_IMAGE_BACKEND ./backend
    - docker push $REGISTRY_URL/$DOCKER_IMAGE_BACKEND
  rules:
    - <<: *if-master-branch
      exists:
        - backend/Dockerfile

# Build Stage - Frontend
docker-build-frontend:
  stage: build
  script:
    - echo "Building frontend image..."
    - echo "docker build -pull -t $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND ./frontend"
    - docker build --pull -t $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND ./frontend
    - docker push $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND
  rules:
    - <<: *if-master-branch
      exists:
        - frontend/Dockerfile

# Deploy Stage
deploy-docker:
  stage: deploy
  script:
    - |
      set -e
      echo "=== Deploying OpsManager ==="
      echo "Backend Image: $REGISTRY_URL/$DOCKER_IMAGE_BACKEND"
      echo "Frontend Image: $REGISTRY_URL/$DOCKER_IMAGE_FRONTEND"

      export REGISTRY_URL=$REGISTRY_URL
      export VERSION=v1.0.$CI_PIPELINE_IID

      cd $REMOTE_DIR
      docker compose pull
      docker compose down
      docker compose up -d

      echo "Waiting for services to start..."
      MAX_RETRIES=12
      RETRY_INTERVAL=5
      for i in $(seq 1 $MAX_RETRIES); do
        if curl -sf http://localhost:8080/health > /dev/null 2>&1; then
          echo "=== Deployment successful (attempt $i) ==="
          exit 0
        fi
        echo "Health check attempt $i/$MAX_RETRIES failed, retrying in ${RETRY_INTERVAL}s..."
        sleep $RETRY_INTERVAL
      done

      echo "=== Health check failed after $MAX_RETRIES attempts ==="
      docker compose logs --tail=50
      exit 1
  rules:
    - <<: *if-master-branch
