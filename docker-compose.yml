services:
  postgres:
    image: 192.168.100.213:8083/devops/postgres:15-alpine
    container_name: ops-postgres
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: ${DB_USER:-opsmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opsmanager}
      POSTGRES_DB: ${DB_NAME:-opsmanager}
      TZ: Asia/Shanghai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opsmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  redis:
    image: 192.168.100.213:8083/devops/redis:7-alpine
    container_name: ops-redis
    ports:
      - "16379:6379"
    environment:
      - TZ=Asia/Shanghai
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  backend:
    image: ${REGISTRY_URL:-192.168.100.213:8083}/opsmanager/backend:${VERSION:-latest}
    container_name: ops-backend
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-opsmanager}:${DB_PASSWORD:-opsmanager}@postgres:5432/${DB_NAME:-opsmanager}
      - REDIS_URL=redis://redis:6379/0
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network
    restart: unless-stopped

  nginx:
    image: ${REGISTRY_URL:-192.168.100.213:8083}/opsmanager/frontend:${VERSION:-latest}
    container_name: ops-nginx
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "8080:80"
      # - "443:443"  # Enable for HTTPS
    depends_on:
      - backend
    networks:
      - ops-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ops-network:
    driver: bridge
