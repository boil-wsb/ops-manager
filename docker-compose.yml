version: '3.8'

services:
  postgres:
    image: 192.168.100.213:8083/devops/postgres:15-alpine
    container_name: ops-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-opsmanager}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-opsmanager}
      POSTGRES_DB: ${DB_NAME:-opsmanager}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-opsmanager}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  redis:
    image: 192.168.100.213:8083/devops/redis:7-alpine
    container_name: ops-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ops-network

  backend:
    image: ${REGISTRY_URL:-192.168.100.213:8083}/opsmanager/backend:${VERSION:-latest}
    container_name: ops-backend
    environment:
      - APP_NAME=${APP_NAME:-OpsManager V2}
      - APP_VERSION=${APP_VERSION:-1.0.0}
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-opsmanager}:${DB_PASSWORD:-opsmanager}@postgres:5432/${DB_NAME:-opsmanager}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_FORMAT=${LOG_FORMAT:-json}
    volumes:
      - ./logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ops-network
    restart: unless-stopped

  celery-worker:
    image: ${REGISTRY_URL:-192.168.100.213:8083}/opsmanager/backend:${VERSION:-latest}
    container_name: ops-celery-worker
    environment:
      - APP_NAME=${APP_NAME:-OpsManager V2}
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-opsmanager}:${DB_PASSWORD:-opsmanager}@postgres:5432/${DB_NAME:-opsmanager}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    command: celery -A app.tasks.celery_app worker -l info -c 4
    networks:
      - ops-network
    restart: unless-stopped

  celery-beat:
    image: ${REGISTRY_URL:-192.168.100.213:8083}/opsmanager/backend:${VERSION:-latest}
    container_name: ops-celery-beat
    environment:
      - APP_NAME=${APP_NAME:-OpsManager V2}
      - DEBUG=${DEBUG:-false}
      - SECRET_KEY=${SECRET_KEY}
      - DATABASE_URL=postgresql+asyncpg://${DB_USER:-opsmanager}:${DB_PASSWORD:-opsmanager}@postgres:5432/${DB_NAME:-opsmanager}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ./logs:/app/logs
    depends_on:
      - postgres
      - redis
    command: celery -A app.tasks.celery_app beat -l info
    networks:
      - ops-network
    restart: unless-stopped

  nginx:
    image: ${REGISTRY_URL:-192.168.100.213:8083}/opsmanager/frontend:${VERSION:-latest}
    container_name: ops-nginx
    ports:
      - "8080:80"
      # - "443:443"  # Enable for HTTPS
    depends_on:
      - backend
    networks:
      - ops-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ops-network:
    driver: bridge
